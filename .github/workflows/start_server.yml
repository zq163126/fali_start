name: Trigger FalixNodes Start

on:
  repository_dispatch:
    types: [start_minecraft_server]

jobs:
  start-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Start Script
        env:
          FALIX_WEB_COOKIE: ${{ secrets.FALIX_WEB_COOKIE }}
          FALIX_SERVER_ID: ${{ secrets.FALIX_SERVER_ID }}
        run: |
          python - <<'EOF'
          import os
          import requests
          import time

          cookie = os.environ.get("FALIX_WEB_COOKIE")
          server_id = os.environ.get("FALIX_SERVER_ID", "2874150")
          
          url = f"https://client.falixnodes.net/api/v1/servers/{server_id}/console/power"
          
          headers = {
              "accept": "*/*",
              "accept-language": "zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7",
              "cookie": cookie,
              "referer": f"https://client.falixnodes.net/server/{server_id}/console",
              "sec-ch-ua": '"Not;A=Brand";v="8", "Chromium";v="150", "Google Chrome";v="150"',
              "sec-ch-ua-mobile": "?0",
              "sec-ch-ua-platform": '"Windows"',
              "sec-fetch-dest": "empty",
              "sec-fetch-mode": "cors",
              "sec-fetch-site": "same-origin",
              "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36",
              "content-type": "application/json"
          }

          print("=== 第一步：请求 Challenge ===")
          step1_payload = {
              "action": "start",
              "token": "",
              "update": None,
              "node_id": 5056
          }
          
          resp1 = requests.post(url, json=step1_payload, headers=headers)
          print("Status:", resp1.status_code)
          print("Response:", resp1.text)
          
          data1 = resp1.json()
          challenge = data1.get("challenge")
          
          if not challenge:
              print("❌ 未能获取到 challenge，开机失败。")
              exit(1)
              
          print(- * 30)
          print(f"成功获取 Challenge: {challenge}")
          print("等待 1 秒...")
          time.sleep(1)
          
          print("=== 第二步：带 Challenge 发送启动指令 ===")
          step2_payload = {
              "action": "start",
              "token": challenge,
              "update": None,
              "node_id": 5056
          }
          
          resp2 = requests.post(url, json=step2_payload, headers=headers)
          print("Status:", resp2.status_code)
          print("Response:", resp2.text)
          
          data2 = resp2.json()
          if data2.get("success") is True:
              print("🚀 服务器已成功拉起！")
          else:
              print("❌ 启动被拒绝。")
              exit(1)
          EOF
